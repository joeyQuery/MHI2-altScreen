name: mu0678-build
on:
  push:
    paths:
      - 'src/mu0678/**'
      - 'tools/build-mu0678-cluster.sh'
      - '.github/workflows/mu0678-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./tools/build-mu0678-cluster.sh /tmp/libmhi2mu0678altscreen.so
      - name: Disassemble
        run: |
          llvm-objdump -d --triple=armv7-none-eabi /tmp/libmhi2mu0678altscreen.so > /tmp/mu0678.dis
          readelf -h /tmp/libmhi2mu0678altscreen.so
          grep -E 'mu0678_interpose_setup111|mu0678_alt111_publish_decode|screen_stream_create_hook' /tmp/mu0678.dis || true
